version: '3.8'

services:
  # 1. MySQL 8 Database
  mysql:
    image: mysql:8.0
    container_name: ecofruit_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ecofruit_db
      MYSQL_USER: ecofruit_user
      MYSQL_PASSWORD: ecofruit_password_2026
      MYSQL_ROOT_PASSWORD: ecofruit_root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # 2. Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: ecofruit_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 3. Python Django Backend
  web:
    build: .
    container_name: ecofruit_backend
    restart: always
    command: >
      sh -c "python backend/manage.py migrate &&
             python backend/manage.py seed_data &&
             gunicorn --chdir backend core.wsgi:application --bind 0.0.0.0:8000 --workers 4"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=ecofruit_super_secret_enterprise_django_key_2026_!@#$%^
      - ALLOWED_HOSTS=*
      - DATABASE_URL=mysql://ecofruit_user:ecofruit_password_2026@mysql:3306/ecofruit_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. Celery Asynchronous Worker
  celery:
    build: .
    container_name: ecofruit_celery
    restart: always
    command: celery -A core --workdir backend worker -l info --concurrency 2
    volumes:
      - .:/app
    environment:
      - SECRET_KEY=ecofruit_super_secret_enterprise_django_key_2026_!@#$%^
      - DATABASE_URL=mysql://ecofruit_user:ecofruit_password_2026@mysql:3306/ecofruit_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - web
      - redis

volumes:
  mysql_data:
  redis_data:
