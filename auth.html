<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập / Đăng Ký Tài Khoản - GreenFruit Eco</title>
  
  <!-- SEO Meta Tags -->
  <meta name="description" content="Đăng nhập hoặc tạo tài khoản tại GreenFruit Eco để nhận ngay voucher giảm 10%, tích điểm thành viên và quản lý đơn hàng hoa quả sạch.">
  <meta name="robots" content="noindex, follow">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍏</text></svg>">

  <!-- Bootstrap 5 CSS & Font Awesome 6 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

  <!-- Main Header -->
  <header class="main-header">
    <div class="container py-2 text-center">
      <a href="index.html" class="brand-logo d-inline-flex text-decoration-none">
        <div class="logo-icon"><i class="fa-solid fa-apple-whole"></i></div>
        <span>Green<span class="brand-highlight">Fruit</span></span>
      </a>
    </div>
  </header>

  <!-- MAIN AUTH CONTENT -->
  <main class="auth-wrapper">
    <div class="auth-card">
      
      <!-- Header with Switcher Tabs -->
      <div class="auth-header">
        <h1 class="h4 fw-bold text-white mb-1">Tài Khoản GreenFruit</h1>
        <p class="text-white-50 small mb-0">Hương vị thiên nhiên trong từng múi quả tươi</p>

        <ul class="nav auth-nav-tabs" id="authTabs" role="tablist">
          <li class="nav-item flex-fill">
            <button class="nav-link active w-100" id="tab-login" data-bs-toggle="tab" data-bs-target="#pane-login" type="button" role="tab">
              Đăng Nhập
            </button>
          </li>
          <li class="nav-item flex-fill">
            <button class="nav-link w-100" id="tab-register" data-bs-toggle="tab" data-bs-target="#pane-register" type="button" role="tab">
              Đăng Ký
            </button>
          </li>
        </ul>
      </div>

      <!-- Auth Body -->
      <div class="auth-body">
        <div class="tab-content" id="authTabContent">
          
          <!-- TAB 1: ĐĂNG NHẬP -->
          <div class="tab-pane fade show active" id="pane-login" role="tabpanel">
            
            <!-- Quick Demo Login Pill -->
            <div class="demo-account-box">
              <div class="small">
                <strong class="text-success d-block"><i class="fa-solid fa-sparkles me-1"></i> Tài khoản Demo sẵn sàng:</strong>
                <span class="text-muted"><code>demo@greenfruit.vn</code> / <code>password123</code></span>
              </div>
              <button type="button" class="btn btn-sm btn-primary-gf" id="btn-demo-login">
                Đăng nhập 1-Click
              </button>
            </div>

            <form id="login-form">
              <div class="mb-3">
                <label class="form-label small fw-bold">Địa chỉ Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
                  <input type="email" class="form-control" id="login-email" placeholder="demo@greenfruit.vn" value="demo@greenfruit.vn" required>
                </div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label class="form-label small fw-bold mb-0">Mật khẩu</label>
                  <a href="#" class="small text-muted" onclick="alert('Mật khẩu tài khoản demo là: password123')">Quên mật khẩu?</a>
                </div>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                  <input type="password" class="form-control" id="login-password" placeholder="••••••••" value="password123" required>
                </div>
              </div>

              <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">
                  Ghi nhớ đăng nhập trên thiết bị này
                </label>
              </div>

              <button type="submit" class="btn btn-primary-gf w-100 py-3 font-heading fs-5">
                <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Đăng Nhập Ngay
              </button>
            </form>
          </div>

          <!-- TAB 2: ĐĂNG KÝ -->
          <div class="tab-pane fade" id="pane-register" role="tabpanel">
            <form id="register-form">
              <div class="mb-3">
                <label class="form-label small fw-bold">Họ và tên của bạn</label>
                <input type="text" class="form-control" id="reg-name" placeholder="Nguyễn Văn A" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold">Địa chỉ Email</label>
                <input type="email" class="form-control" id="reg-email" placeholder="tenban@email.com" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold">Số điện thoại</label>
                <input type="tel" class="form-control" id="reg-phone" placeholder="0909 123 456" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold">Mật khẩu</label>
                <input type="password" class="form-control" id="reg-password" placeholder="Tối thiểu 6 ký tự" minlength="6" required>
              </div>

              <div class="mb-3">
                <label class="form-label small fw-bold">Xác nhận mật khẩu</label>
                <input type="password" class="form-control" id="reg-confirm-password" placeholder="Nhập lại mật khẩu" required>
              </div>

              <button type="submit" class="btn btn-primary-gf w-100 py-3 font-heading fs-5">
                <i class="fa-solid fa-user-plus me-2"></i> Tạo Tài Khoản Ngay
              </button>
            </form>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>

</body>
</html>
